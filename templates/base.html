{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Important Dates Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <img src="{% static 'homepage/img/logo.png' %}" alt="Important Dates" class="tracker-logo ms-3 mt-3">
    {% include "includes/navigation.html" %}
    
    <main class="container mt-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3 text-muted">
        <p>© <span id="current-year"></span> Important Dates Tracker</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
